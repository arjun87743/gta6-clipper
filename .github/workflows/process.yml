name: Process new streams

# Every 2 hours: look for a new AsianJeff GTA 6 VOD, cut and edit the best moments, queue them.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      vod_id:
        description: "Process this VOD id now (blank = check the channel for new ones)"
        required: false
      mode:
        description: "process = rank with Claude; seed = use seed/ rankings (already approved clips)"
        type: choice
        options: [process, seed]
        default: process

permissions:
  contents: write   # push the state branch
  issues: write     # notifications
  actions: read

concurrency:
  group: clipper-state   # one run at a time touches the state branch
  cancel-in-progress: false

env:
  CAMPAIGN: asianjeff
  GH_TOKEN: ${{ github.token }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Load state
        run: bash scripts/state.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install tools
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core ttf-mscorefonts-installer fonts-montserrat > /dev/null
          pip install -q -r requirements-cloud.txt
          mkdir -p bin
          gh release download --repo lay295/TwitchDownloader --pattern "*CLI*Linux-x64.zip" -D /tmp/tdl
          unzip -q -o /tmp/tdl/*.zip -d bin && chmod +x bin/TwitchDownloaderCLI
          npm install -g --silent @anthropic-ai/claude-code
          python pipeline/make_assets.py

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: Find a stream to process
        id: pick
        run: |
          if [ -n "${{ inputs.vod_id }}" ]; then
            echo "vod=${{ inputs.vod_id }}" >> "$GITHUB_OUTPUT"
          else
            ids=$(python pipeline/cloud.py watch --campaign "$CAMPAIGN" --limit 1)
            echo "new VODs: $ids"
            echo "vod=$(python -c "import json,sys; v=json.loads(sys.argv[1]); print(v[0] if v else '')" "$ids")" >> "$GITHUB_OUTPUT"
          fi

      - name: Process
        if: steps.pick.outputs.vod != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mode="${{ inputs.mode }}"; [ -z "$mode" ] && mode=process
          python pipeline/cloud.py "$mode" --campaign "$CAMPAIGN" --vod-id "${{ steps.pick.outputs.vod }}"

      - name: Keep the clips for the posting runs
        if: steps.pick.outputs.vod != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ steps.pick.outputs.vod }}
          path: output/clips/
          retention-days: 30
          if-no-files-found: ignore

      - name: Save state
        if: always() && steps.pick.outputs.vod != ''
        run: bash scripts/state.sh push "process ${{ steps.pick.outputs.vod }} (run ${{ github.run_id }})"
